<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Projekt X – Designvorschau (Beispieldaten)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main" data-action="skip">Zum Inhalt springen</a>

  <div class="preview-band" role="note">
    <span class="preview-band__text">Designvorschau · nur Beispieldaten · keine echte Anwendung</span>
    <button type="button" class="preview-band__reset" data-action="reset-data">
      <span class="label-long">Beispieldaten zurücksetzen</span><span class="label-short">Zurücksetzen</span>
    </button>
  </div>

  <header class="app-header">
    <a class="wordmark" href="#/arbeitsplatz" aria-label="Projekt X – zum Arbeitsplatz">
      <img class="wordmark__logo" src="assets/logo-projekt-x.webp" alt="Projekt X" width="2000" height="667">
    </a>

    <div class="theme-switch">
      <button type="button" class="theme-toggle" data-action="toggle-theme" aria-pressed="false" aria-label="Dunkle Ansicht" title="Dunkle Ansicht">
        <span class="theme-toggle__icon" aria-hidden="true">☾</span>
      </button>
    </div>

    <div class="current-user" id="current-user"></div>
  </header>

  <div class="app-body">
    <nav class="app-nav" aria-label="Hauptnavigation">
      <ul class="app-nav__list">
        <li>
          <a class="app-nav__item" href="#/arbeitsplatz" data-route="arbeitsplatz">
            <svg class="app-nav__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <span class="app-nav__label">Mein Arbeitsplatz</span>
          </a>
        </li>
        <li>
          <a class="app-nav__item" href="#/projekte" data-route="projekte">
            <svg class="app-nav__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="4" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="4" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="13" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            <span class="app-nav__label">Projekte</span>
          </a>
        </li>
        <li>
          <a class="app-nav__item" href="#/management" data-route="management">
            <svg class="app-nav__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 19V11M10 19V6M15 19v-5M20 19V9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span class="app-nav__label">Management</span>
          </a>
        </li>
        <li>
          <span class="app-nav__item is-disabled" aria-disabled="true" title="Administration folgt später">
            <svg class="app-nav__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span class="app-nav__label">Administration <span class="app-nav__later">folgt später</span></span>
          </span>
        </li>
      </ul>
    </nav>

    <main id="main" class="app-main" tabindex="-1">
      <noscript>
        <p class="empty-state">Diese Designvorschau benötigt JavaScript im Browser.</p>
      </noscript>
    </main>
  </div>

  <dialog id="task-dialog" class="task-dialog" aria-labelledby="dlg-title"></dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
