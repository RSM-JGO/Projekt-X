{% if task.due_date %}<span class="due{% if overdue %} due--overdue{% elif is_today %} due--today{% endif %}">{% if task.is_done %}Fällig war {{ task.due_date|date:"d.m.Y" }}{% elif overdue %}Überfällig seit {{ task.due_date|date:"d.m.Y" }}{% elif is_today %}Heute fällig{% else %}Fällig {{ task.due_date|date:"d.m.Y" }}{% endif %}</span>{% else %}<span class="due muted">Ohne Fälligkeit</span>{% endif %}
